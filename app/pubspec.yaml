name: fantikpay
description: "ФантикПэй — игровой банк для детей на NFC-картах."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  nfc_manager: ^4.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  sqlite3: ^3.6.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-500.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-600.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-800.ttf
          weight: 800
