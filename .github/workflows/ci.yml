name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fantik
          POSTGRES_PASSWORD: fantik
          POSTGRES_DB: fantikpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fantik" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: server
    env:
      FP_DATABASE_URL: postgresql+asyncpg://fantik:fantik@localhost:5432/fantikpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fantik
          POSTGRES_PASSWORD: fantik
          POSTGRES_DB: fantikpay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fantik" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - uses: astral-sh/setup-uv@v5
      - name: Start API for integration tests
        working-directory: server
        env:
          FP_LOGIN_RATE_LIMIT: "1000"
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --port 8765 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8765/health && break; sleep 1; done
      - working-directory: app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/data/db.g.dart
          flutter analyze
          flutter test --dart-define=API_URL=http://localhost:8765
