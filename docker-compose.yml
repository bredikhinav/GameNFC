# Production stack on one VPS in Russia (152-FZ): API, PostgreSQL, Redis, Caddy (HTTPS),
# cron jobs and a daily database backup.
#   sudo bash deploy/install.sh   # creates .env with random secrets, installs Docker, starts
services:
  api:
    build: ./server
    env_file: .env
    environment:
      FP_DATABASE_URL: postgresql+asyncpg://fantik:${POSTGRES_PASSWORD}@db:5432/fantikpay
      FP_REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  jobs:
    build: ./server
    env_file: .env
    environment:
      FP_DATABASE_URL: postgresql+asyncpg://fantik:${POSTGRES_PASSWORD}@db:5432/fantikpay
      FP_REDIS_URL: redis://redis:6379/0
    # Allowances every hour (each is idempotent per day), reconciliation every night.
    command: >
      sh -c 'while true; do
        python -m app.cli run-allowances;
        if [ "$$(date +%H)" = "03" ]; then python -m app.cli reconcile; fi;
        sleep 3600;
      done'
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fantik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fantikpay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantik -d fantikpay"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # Daily dump, keep 14 days. Copy ./backups off the server too.
    command: >
      sh -c 'while true; do
        pg_dump -h db -U fantik -Fc fantikpay > /backups/fantikpay-$$(date +%F).dump;
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400;
      done'
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      FP_DOMAIN: ${FP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
